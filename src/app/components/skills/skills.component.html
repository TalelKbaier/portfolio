<section id="skills" class="skills-section">
  <div class="container">
    <div class="section-header" data-aos="fade-up">
      <h2 class="section-title">{{ translate('skills.title') }}</h2>
      <p class="section-subtitle">{{ translate('skills.subtitle') }}</p>
    </div>

    <!-- Category Filter -->
    <div class="category-filter" data-aos="fade-up" data-aos-delay="200">
      <button 
        class="filter-btn" 
        [class.active]="activeCategory === 'all'"
        (click)="setActiveCategory('all')">
        {{ translate('skills.all') }}
      </button>
      <button 
        *ngFor="let category of skillCategories"
        class="filter-btn" 
        [class.active]="activeCategory === category.key"
        (click)="setActiveCategory(category.key)">
        {{ translate('skills.' + category.key) }}
      </button>
    </div>

    <!-- Skills Grid - Organized by Categories when showing all -->
    <div *ngIf="activeCategory === 'all'" class="skills-categories" data-aos="fade-up" data-aos-delay="400">
      <div *ngFor="let category of skillCategories; let catIndex = index" class="category-card"
        [attr.data-aos]="'zoom-in'" [attr.data-aos-delay]="catIndex * 100">
        <div class="category-header">
          <div class="category-icon">
            <i class="fas fa-code" *ngIf="category.key === 'programming'"></i>
            <i class="fas fa-globe" *ngIf="category.key === 'web'"></i>
            <i class="fas fa-cloud" *ngIf="category.key === 'cloud'"></i>
            <i class="fas fa-network-wired" *ngIf="category.key === 'systems'"></i>
            <i class="fas fa-database" *ngIf="category.key === 'database'"></i>
            <i class="fas fa-brain" *ngIf="category.key === 'ai'"></i>
            <i class="fas fa-tools" *ngIf="category.key === 'tools'"></i>
          </div>
          <h3 class="category-title">{{ getCategoryTitle(category.key) }}</h3>
        </div>
        <div class="skills-chips">
          <span *ngFor="let skill of getSkillsByCategory()[category.key]; let i = index" class="skill-chip">
            <i [class]="skill.icon"></i>
            {{ skill.name }}
          </span>
        </div>
      </div>
    </div>

    <!-- Skills Panel - Single category view -->
    <div *ngIf="activeCategory !== 'all'" class="category-panel" data-aos="fade-up" data-aos-delay="400">
      <div class="skills-chips">
        <span *ngFor="let skill of getFilteredSkills(); let i = index" class="skill-chip">
          <i [class]="skill.icon"></i>
          {{ skill.name }}
        </span>
      </div>
    </div>

    <!-- Certifications -->
    <div class="certifications" data-aos="fade-up" data-aos-delay="600">
      <h3 class="certifications-title">{{ translate('skills.certifications') }}</h3>
      <div class="certifications-grid">
        <div class="certification-item" *ngFor="let cert of certifications; let i = index"
          [attr.data-aos]="'flip-left'" [attr.data-aos-delay]="(i + 1) * 200">
          <div class="cert-icon">
            <i [class]="cert.icon"></i>
          </div>
          <div class="cert-content">
            <h4>{{ text(cert.name) }}</h4>
            <p>{{ cert.issuer }}</p>
            <span class="cert-year">{{ cert.year }}</span>
          </div>
          <a [href]="cert.link" target="_blank" rel="noopener" class="cert-link"
             aria-label="View {{ text(cert.name) }} certificate">
            <i class="fas fa-external-link-alt"></i>
            {{ translate('skills.viewCertificate') }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
